[project]
name = "hamac"
version = "0.1.0"
description = "Hamac : gestion des congés de l'équipe (API Django)"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0,<6.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-django>=4.11",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
